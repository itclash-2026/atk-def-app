version: "3.8"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: kmitl_user
      POSTGRES_PASSWORD: kmitl_password
      POSTGRES_DB: kmitl_web
    command: postgres -c max_connections=20
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 200M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmitl_user -d kmitl_web"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      - DATABASE_URL=postgres://kmitl_user:kmitl_password@db:5432/kmitl_web?sslmode=disable
      - JWT_SECRET=supersecretjwtkey_for_kmitl
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 200M
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G

volumes:
  pgdata:
